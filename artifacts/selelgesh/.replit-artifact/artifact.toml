kind = "web"
previewPath = "/"
title = "ስለ ልጅሽ – Selelgesh"
version = "1.0.0"
id = "artifacts/selelgesh"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25611

[services.development]
run = "pnpm --filter @workspace/selelgesh run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/selelgesh", "run", "build" ]
publicDir = "artifacts/selelgesh/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25611"
BASE_PATH = "/"
